plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.147'
}

apply from: rootProject.file('properties.gradle')
modBaseName = 'molecule'

version = modVersion
group = modGroup

base {
    archivesName = modBaseName
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = neoForgeVersion

    if  (mappingsChannel == "parchment") {
        parchment {
            mappingsVersion =  project.mappingsVersion
            minecraftVersion =  project.mappingsMinecraftVersion
        }
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.modBaseName
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.modBaseName
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.modBaseName
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${project.modBaseName}" {
            sourceSet(sourceSets.main)
            sourceSet(rootProject.sourceSets.main)
        }
    }

    // Add modding dependencies (Minecraft classes) to the test source set
    addModdingDependenciesTo sourceSets.test

}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation project(':')
    testImplementation rootProject.sourceSets.test.output
    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-inline:5.2.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.2.0'
}

test {
    useJUnitPlatform()
    dependsOn rootProject.tasks.named('testClasses')
    maxParallelForks = 1
    maxHeapSize = '512m'
    jvmArgs '-Dnet.bytebuddy.experimental=true', '-Djava.awt.headless=true', '-XX:ActiveProcessorCount=2'
}

// Example for how to get properties into the manifest for reading by the runtime.
jar {
    manifest {
        attributes(["Specification-Title"     : "Molecule",
                    "Specification-Vendor"    : "Trident",
                    "Specification-Version"   : "24.0",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : "${version}",
                    "Implementation-Vendor"   : "Trident",
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")],)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
